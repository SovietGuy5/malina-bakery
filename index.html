<script>
const TG=window.Telegram?.WebApp; if(TG){TG.ready();TG.expand();document.documentElement.style.setProperty('--tg-bg',TG.themeParams.bg_color||'#eef2f5');document.documentElement.style.setProperty('--tg-card',TG.themeParams.secondary_bg_color||'#fff');document.documentElement.style.setProperty('--tg-text',TG.themeParams.text_color||'#17212b');document.documentElement.style.setProperty('--tg-muted',TG.themeParams.hint_color||'#71808f');document.documentElement.style.setProperty('--tg-blue',TG.themeParams.button_color||'#2aabee');document.documentElement.style.setProperty('--tg-blue2',TG.themeParams.link_color||'#229ed9'); if(TG.initDataUnsafe?.user){const u=TG.initDataUnsafe.user;document.getElementById('tgUser').textContent=u.first_name||u.username||'Telegram';} if(TG.BackButton){TG.BackButton.onClick(()=>{if(document.getElementById('cartDrawer').classList.contains('open'))closeCart();else window.history.back();});}}

const CATALOG_CONFIG={SHEET_ID:'1J8hFErndX8rmt4Q6_lCvdSeAkuYL28cmvRKVMPA2Uuw',SHEET_NAME:'Каталог',COLUMNS:{name:'Название',category:'Категория',description:'Описание',weight:'Вес',price:'Цена',image:'Картинка',tag:'Метка',inStock:'В наличии'}};

// ВАЖНО: Укажите полный HTTPS URL с концовкой /order, иначе мобильный Telegram заблокирует запрос.
const ORDER_API_URL='https://website-for-bakery.kolganovd24.workers.dev/order'; 

const FALLBACK_PRODUCTS=[{name:'Медово-карамельный торт',category:'Торты',description:'Мёд, сметанный крем, карамель',weight:'1.2 кг',price:'2 900 ₽',image:'assets/hero-cheesecake-1.png',tag:'Хит',inStock:'Да'},{name:'Классический чизкейк Нью-Йорк',category:'Чизкейки',description:'Сливочный сыр, песочная основа',weight:'900 г',price:'2 200 ₽',image:'assets/hero-cheesecake-2.png',tag:'',inStock:'Да'},{name:'Меренговый рулет с малиной',category:'Меренговые рулеты',description:'Безе, сливки, малина',weight:'600 г',price:'1 850 ₽',image:'assets/hero-cheesecake-2.png',tag:'Новинка',inStock:'Да'},{name:'Набор мини-пирожных',category:'Пирожные',description:'6 видов начинок, набор 12 шт',weight:'',price:'1 650 ₽',image:'assets/hero-cheesecake-1.png',tag:'',inStock:'Да'}];
let allProducts=[],activeFilter='Все',currentFiltered=[],currentHits=[],cart=[];
const fallbackIcon='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="#d8dde1"/><path d="M28 62c9-16 22-24 42-14 4 2 7 7 9 14H28z" fill="#8a5b46"/></svg>';

function buildSheetUrl(){return `https://docs.google.com/spreadsheets/d/${CATALOG_CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CATALOG_CONFIG.SHEET_NAME)}`}
function normalizeRow(r){const c=CATALOG_CONFIG.COLUMNS;return{name:(r[c.name]||'').trim(),category:(r[c.category]||'').trim(),description:(r[c.description]||'').trim(),weight:(r[c.weight]||'').trim(),price:(r[c.price]||'').trim(),image:(r[c.image]||'').trim(),tag:(r[c.tag]||'').trim(),inStock:(r[c.inStock]||'Да').trim()}}
async function loadCatalog(){try{const res=await fetch(buildSheetUrl());if(!res.ok)throw 0;const parsed=Papa.parse(await res.text(),{header:true,skipEmptyLines:true});allProducts=parsed.data.map(normalizeRow).filter(p=>p.name);if(!allProducts.length)throw 0}catch(e){allProducts=FALLBACK_PRODUCTS}renderAll()}
function money(n){return Number(n||0).toLocaleString('ru-RU')+' ₽'}function priceNum(s){const d=(s||'').replace(/[^\d]/g,'');return d?parseInt(d,10):0}
function img(p){return p.image?`<img src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.style.display='none'">`:fallbackIcon}function escapeHtml(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function renderFilters(){const cats=['Все',...new Set(allProducts.map(p=>p.category).filter(Boolean))];filtersContainer.innerHTML=cats.map(c=>`<button class="filter ${c===activeFilter?'active':''}" data-filter="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}
function card(p,i,hit=false){const out=/нет/i.test(p.inStock);return `<article class="card"><div class="card-img">${p.tag?`<span class="tag">${escapeHtml(p.tag)}</span>`:''}${img(p)}</div><div class="card-body"><h3>${escapeHtml(p.name)}</h3><div class="meta">${escapeHtml([p.description,p.weight].filter(Boolean).join(' · '))}</div><div class="card-foot"><span class="price">${escapeHtml(p.price)}</span><button class="add" data-add="${i}" ${out?'disabled':''} aria-label="Добавить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div></div></article>`}
function renderCatalog(){currentFiltered=activeFilter==='Все'?allProducts:allProducts.filter(p=>p.category===activeFilter);prodGrid.innerHTML=currentFiltered.map(card).join('')||'<div class="empty">В этой категории пока пусто.</div>'}
function renderHits(){currentHits=allProducts.filter(p=>/хит/i.test(p.tag));if(!currentHits.length)currentHits=allProducts.slice(0,3);currentHits=currentHits.slice(0,3);hitsRow.innerHTML=currentHits.map(card).join('')||'<div class="empty">Хиты появятся здесь.</div>'}
function renderAll(){renderFilters();renderCatalog();renderHits()}

filtersContainer.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;activeFilter=b.dataset.filter;renderFilters();renderCatalog()});
prodGrid.addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b)addToCart(currentFiltered[+b.dataset.add])});
hitsRow.addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b)addToCart(currentHits[+b.dataset.add])});

function addToCart(p){if(!p)return;const x=cart.find(i=>i.name===p.name);if(x)x.qty++;else cart.push({name:p.name,priceLabel:p.price,priceNum:priceNum(p.price),image:p.image,qty:1});renderCart();openCart()}
function renderCart(){const n=cart.reduce((s,i)=>s+i.qty,0),total=cart.reduce((s,i)=>s+i.priceNum*i.qty,0);cartCount.textContent=n;cartCount.hidden=!n;floatingCartTotal.textContent=money(total);floatingCartTotal.hidden=!n;cartSummary.style.display=n?'block':'none';if(!n){cartItems.innerHTML='<div class="empty">Корзина пуста.<br>Добавьте любимый десерт из каталога.</div>';return}cartTitle.textContent=`Корзина · ${n}`;cartTotal.textContent=money(total);cartItems.innerHTML=cart.map((i,idx)=>`<div class="cart-item"><div class="cart-thumb">${i.image?`<img src="${i.image}" alt="">`:fallbackIcon}</div><div class="cart-info"><strong>${escapeHtml(i.name)}</strong><small>${money(i.priceNum)} / шт.</small><div class="qty"><button onclick="qty(${idx},-1)">−</button><b>${i.qty}</b><button onclick="qty(${idx},1)">+</button></div></div><div><div class="cart-line">${money(i.priceNum*i.qty)}</div><button class="trash" onclick="removeItem(${idx})" aria-label="Удалить">⌫</button></div></div>`).join('');if(TG?.MainButton){if(n){TG.MainButton.setText(`Оформить · ${money(total)}`);TG.MainButton.show();}else TG.MainButton.hide()}}
function qty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}function removeItem(i){cart.splice(i,1);renderCart()}function clearAll(){cart=[];renderCart()}
function openCart(){cartDrawer.classList.add('open');cartOverlay.classList.add('open');showView('items');TG?.BackButton?.show()}
function closeCart(){cartDrawer.classList.remove('open');cartOverlay.classList.remove('open');TG?.BackButton?.hide()}
function showView(v){cartViewItems.classList.toggle('hidden',v!=='items');cartViewForm.classList.toggle('hidden',v!=='form');cartViewSuccess.classList.toggle('hidden',v!=='success');if(v==='form'){cartOrderRecap.textContent=cart.map(i=>`${i.name} × ${i.qty}`).join(' · ')+' · '+money(cart.reduce((s,i)=>s+i.priceNum*i.qty,0));orderStatus.textContent=''}}

mobileStickyBtn.onclick=openCart;heroCart.onclick=openCart;cartClose.onclick=closeCart;cartOverlay.onclick=closeCart;clearCart.onclick=clearAll;
checkoutBtn.onclick=()=>{if(cart.length)showView('form')};
ckNewOrder.onclick=()=>{showView('items');closeCart()};
document.querySelectorAll('input[name="method"]').forEach(r=>r.addEventListener('change',()=>ckAddressWrap.classList.toggle('hidden',r.value!=='Доставка'||!r.checked)));
TG?.MainButton?.onClick(()=>{if(cart.length)showView('form')});

async function submitOrder(e) {
  e.preventDefault();
  if(!cart.length) return;
  
  // UX Фикс: Убираем фокус с инпутов, чтобы скрыть клавиатуру на мобилках перед экраном успеха
  if (document.activeElement) document.activeElement.blur();

  submitOrder.disabled = true;
  orderStatus.className = 'status';
  orderStatus.textContent = 'Отправляем заказ…';
  
  const data = {
    name: ckName.value.trim(),
    phone: ckPhone.value.trim(),
    method: document.querySelector('input[name="method"]:checked')?.value || 'Самовывоз',
    address: ckAddress.value.trim(),
    date: ckDate.value.trim(),
    comment: ckComment.value.trim(),
    items: cart.map(i => ({name: i.name, qty: i.qty, price: i.priceNum})),
    total: cart.reduce((s, i) => s + i.priceNum * i.qty, 0),
    telegram: TG?.initDataUnsafe?.user || null,
    initData: TG?.initData || ''
  };
  
  try {
    if(!ORDER_API_URL || !ORDER_API_URL.startsWith('https://')) {
      throw new Error('Укажите полный HTTPS URL бэкенда в переменной ORDER_API_URL');
    }

    const r = await fetch(ORDER_API_URL, {
      method: 'POST',
      headers: {
        'Accept': 'application/json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    });
    
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.error || 'Не удалось отправить заказ');
    
    cart = [];
    renderCart();
    showView('success');
    TG?.MainButton?.hide();
  } catch(err) {
    orderStatus.className = 'status error';
    // На мобилках иногда падает чистый TypeError при ошибке сети, оборачиваем в понятный текст
    orderStatus.textContent = err.name === 'TypeError' ? 'Сетевая ошибка (проверьте подключение)' : err.message;
  } finally {
    submitOrder.disabled = false;
  }
}

cartViewForm.addEventListener('submit', submitOrder);
loadCatalog();
renderCart();
</script>
